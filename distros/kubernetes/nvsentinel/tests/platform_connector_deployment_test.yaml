suite: deployment platform connector RBAC, DaemonSet gate and publishTo guard
release:
  namespace: nvsentinel
templates:
  - templates/platform-connector-deployment-serviceaccount.yaml
  - templates/platform-connector-deployment-deployment.yaml
  - templates/platform-connector-deployment-configmap.yaml
  - templates/platform-connector-deployment-validation.yaml
  - templates/daemonset.yaml
  - templates/serviceaccount.yaml
  - templates/clusterrole.yaml
  - templates/clusterrolebinding.yaml
  - templates/configmap.yaml
tests:
  - it: renders no server RBAC while the deployment platform connector is disabled
    template: templates/platform-connector-deployment-serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

  # The server validates every caller token and always runs the pipeline,
  # which writes node conditions and node events: without these rules every
  # request or condition write is Forbidden.
  - it: grants the server the TokenReview, node and event rules when enabled
    template: templates/platform-connector-deployment-serviceaccount.yaml
    set:
      platformConnector.deployment.enabled: true
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: kind
          value: ClusterRole
        documentIndex: 1
      - equal:
          path: metadata.name
          value: platform-connector-deployment
        documentIndex: 1
      # Exactly the calls the connector makes; nothing it never does (list,
      # watch, patch).
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["nodes"]
              verbs: ["get"]
            - apiGroups: [""]
              resources: ["nodes/status"]
              verbs: ["update"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "get", "update"]
            - apiGroups: ["authentication.k8s.io"]
              resources: ["tokenreviews"]
              verbs: ["create"]
        documentIndex: 1

  - it: binds the server ClusterRole to the server ServiceAccount
    template: templates/platform-connector-deployment-serviceaccount.yaml
    set:
      platformConnector.deployment.enabled: true
    asserts:
      - equal:
          path: kind
          value: ClusterRoleBinding
        documentIndex: 2
      - equal:
          path: metadata.name
          value: platform-connector-deployment
        documentIndex: 2
      - equal:
          path: roleRef.name
          value: platform-connector-deployment
        documentIndex: 2
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
        documentIndex: 2
      - equal:
          path: subjects[0].name
          value: platform-connector-deployment
        documentIndex: 2

  # An enabled server needs node-binding auth: every caller presents a token.
  - it: refuses an enabled server while platform-connector auth is disabled
    template: templates/platform-connector-deployment-deployment.yaml
    set:
      platformConnector.deployment.enabled: true
      global.platformConnectorAuth.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: node-binding auth must be enabled

  # Subcharts read the deployment's connection facts from
  # global.platformConnectorDeployment, and the server templates read the
  # same values: one override must reach the listener env, the container
  # port and the publishers alike.
  - it: propagates a global grpcPort override into the server listener and ports
    template: templates/platform-connector-deployment-deployment.yaml
    set:
      platformConnector.deployment.enabled: true
      global.platformConnectorDeployment.grpcPort: 51000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--listen-addr=:51000"
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: grpc
            containerPort: 51000

  # Everything the server reads is in its own config file, rendered from the
  # same template as the DaemonSet's with fleet sizing and the role's
  # tunables under "deployment"; the container args carry only where the file
  # is, where it listens and the datastore certificate flag.
  - it: renders the deployment's config file with fleet sizing and its tunables
    set:
      platformConnector.deployment.enabled: true
      platformConnector.deployment.auth.tokenCacheSize: 42
      platformConnector.deployment.conditionUpdateTimeout: 3s
    asserts:
      - template: templates/platform-connector-deployment-configmap.yaml
        equal:
          path: metadata.name
          value: platform-connector-deployment
      - template: templates/platform-connector-deployment-configmap.yaml
        matchRegex:
          path: data["config.json"]
          pattern: '"K8sConnectorQps": 1000.00,\n\s*"K8sConnectorBurst": 2000,'
      - template: templates/platform-connector-deployment-configmap.yaml
        matchRegex:
          path: data["config.json"]
          pattern: '"AuthAudience": "platform-connector.nvsentinel.nvidia.com"'
      - template: templates/platform-connector-deployment-configmap.yaml
        matchRegex:
          path: data["config.json"]
          pattern: '"deployment": \{\n\s*"TokenReviewQps": 1000,\n\s*"TokenReviewBurst": 2000,\n\s*"TokenCacheSize": 42,\n\s*"ConditionUpdateTimeout": "3s",\n\s*"MaxConnectionAge": "10m",\n\s*"MaxConnectionIdle": "5m",\n\s*"GrpcReadBufferBytes": 8192,\n\s*"GrpcWriteBufferBytes": 8192\n\s*\}'
      - template: templates/platform-connector-deployment-configmap.yaml
        matchRegex:
          path: data["metadata.toml"]
          pattern: 'cacheSize = 200000\ncacheTTL = "10m"'
      - template: templates/platform-connector-deployment-deployment.yaml
        equal:
          path: spec.template.spec.containers[0].args
          value:
            - "--mode=deployment"
            - "--config=/etc/config/config.json"
            - "--metrics-port=2112"
            - "--listen-addr=:50051"
            - "--tls-cert-dir=/etc/nvsentinel/platform-connector-deployment/tls"
            - "--mongo-client-cert-mount-path=/etc/ssl/mongo-client"
      - template: templates/platform-connector-deployment-deployment.yaml
        equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: platform-connector-deployment
      - template: templates/platform-connector-deployment-deployment.yaml
        equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 4Gi

  # The DaemonSet's file is sized for one node from the same template, so the
  # keys both roles share cannot drift apart.
  - it: renders the DaemonSet's config file for one node
    template: templates/configmap.yaml
    set:
      platformConnector.deployment.enabled: true
    asserts:
      - matchRegex:
          path: data["config.json"]
          pattern: '"K8sConnectorQps": 5.00,\n\s*"K8sConnectorBurst": 10,'
      - matchRegex:
          path: data["config.json"]
          pattern: '"AuthAudience": "platform-connector.nvsentinel.nvidia.com"'
      - notMatchRegex:
          path: data["config.json"]
          pattern: '"deployment":'
      - matchRegex:
          path: data["metadata.toml"]
          pattern: 'cacheSize = 50\ncacheTTL = "60s"'

  # Helm reads numbers from values files as floats and would print a million
  # as "1e+06", which the server refuses to parse at startup.
  - it: renders a large integer knob as an integer
    template: templates/platform-connector-deployment-configmap.yaml
    set:
      platformConnector.deployment.enabled: true
      platformConnector.deployment.auth.tokenCacheSize: 1000000
      platformConnector.deployment.kubernetes.qps: "1500"
    asserts:
      - matchRegex:
          path: data["config.json"]
          pattern: '"TokenCacheSize": 1000000,'
      - matchRegex:
          path: data["config.json"]
          pattern: '"K8sConnectorQps": 1500.00,'

  - it: refuses a fractional integer knob
    template: templates/platform-connector-deployment-deployment.yaml
    set:
      platformConnector.deployment.enabled: true
      platformConnector.deployment.auth.tokenCacheSize: 12.5
    asserts:
      - failedTemplate:
          errorPattern: platformConnector.deployment.auth.tokenCacheSize must be a positive integer

  - it: refuses a non-numeric integer knob
    template: templates/platform-connector-deployment-deployment.yaml
    set:
      platformConnector.deployment.enabled: true
      platformConnector.deployment.connections.readBufferBytes: lots
    asserts:
      - failedTemplate:
          errorPattern: platformConnector.deployment.connections.readBufferBytes must be a positive integer

  # The node-local connector's ServiceAccount, RBAC and ConfigMap exist for
  # the DaemonSet alone; without it they would be an unused cluster-wide grant.
  - it: renders the DaemonSet, its RBAC and its ConfigMap by default
    templates:
      - templates/daemonset.yaml
      - templates/serviceaccount.yaml
      - templates/clusterrole.yaml
      - templates/clusterrolebinding.yaml
      - templates/configmap.yaml
    asserts:
      - hasDocuments:
          count: 1

  # A --reuse-values upgrade from a release without the two keys keeps
  # today's behaviour: the DaemonSet and no Deployment.
  - it: keeps the DaemonSet and no Deployment when both keys are absent
    templates:
      - templates/daemonset.yaml
      - templates/platform-connector-deployment-deployment.yaml
    set:
      platformConnector.daemonset: null
      platformConnector.deployment: null
    asserts:
      - hasDocuments:
          count: 1
        template: templates/daemonset.yaml
      - hasDocuments:
          count: 0
        template: templates/platform-connector-deployment-deployment.yaml

  # The DaemonSet is gated by its own enable flag; the switchover removes it
  # only after every monitor's publishTo is "deployment". Rendering the suite
  # also runs the publishTo guard, so this proves that end state, preflight
  # included, passes it.
  - it: omits the DaemonSet, its RBAC and its ConfigMap when platformConnector.daemonset.enabled is false
    templates:
      - templates/daemonset.yaml
      - templates/serviceaccount.yaml
      - templates/clusterrole.yaml
      - templates/clusterrolebinding.yaml
      - templates/configmap.yaml
    values:
      - ./values/publishers-on-deployment.yaml
    set:
      global.preflight.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  # Both gates refuse non-boolean values: the string "false" (for example
  # from --set-string) is truthy to Go templates and would silently flip the
  # gate the wrong way. Helm attributes the shared helper's failure to the
  # first gated template it renders (the publishTo guard), so that is the
  # template these tests must target.
  - it: refuses a string platformConnector.deployment.enabled
    template: templates/platform-connector-deployment-validation.yaml
    set:
      platformConnector.deployment.enabled: "false"
    asserts:
      - failedTemplate:
          errorPattern: platformConnector.deployment.enabled must be a boolean

  # Helm renders templates in reverse name order, so the failure is reported
  # through the first of them to read the setting, the DaemonSet
  # ServiceAccount.
  - it: refuses a string platformConnector.daemonset.enabled
    template: templates/serviceaccount.yaml
    set:
      platformConnector.daemonset.enabled: "false"
    asserts:
      - failedTemplate:
          errorPattern: platformConnector.daemonset.enabled must be a boolean

  # The DaemonSet writes directly to the database; it must keep its database
  # client wiring and must never carry the mode flag that would flip the
  # binary into the central role.
  - it: keeps the DaemonSet on the direct database path
    template: templates/daemonset.yaml
    set:
      platformConnector.deployment.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--mode=deployment"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONGODB_CLIENT_CERT_MOUNT_PATH
          any: true

  # A publisher on publishTo: deployment mounts the server's CA secret and
  # dials its Service, so with the central Deployment off its pods never
  # start. Subcharts cannot see the umbrella's values, so the umbrella
  # refuses the pairing. A disabled subchart renders no pods and is exempt.
  - it: refuses publishTo deployment on an enabled publisher while the deployment platform connector is disabled
    template: templates/platform-connector-deployment-validation.yaml
    set:
      gpu-health-monitor.publishTo: deployment
    asserts:
      - failedTemplate:
          errorPattern: gpu-health-monitor.publishTo is "deployment" but platformConnector.deployment.enabled is false

  - it: accepts publishTo deployment on a publisher once the deployment platform connector is enabled
    template: templates/platform-connector-deployment-validation.yaml
    set:
      platformConnector.deployment.enabled: true
      gpu-health-monitor.publishTo: deployment
    asserts:
      - hasDocuments:
          count: 0

  - it: ignores publishTo deployment on a disabled publisher subchart
    template: templates/platform-connector-deployment-validation.yaml
    set:
      csp-health-monitor.publishTo: deployment
    asserts:
      - hasDocuments:
          count: 0

  # The inverse pairing: with the DaemonSet off, a publisher left on
  # publishTo: socket would publish to a socket nothing serves and lose
  # its events.
  - it: refuses turning the DaemonSet off while an enabled publisher still publishes to the socket
    template: templates/platform-connector-deployment-validation.yaml
    set:
      platformConnector.daemonset.enabled: false
      platformConnector.deployment.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: publishTo is "socket" but platformConnector.daemonset.enabled is false

  # The preflight checks are a publisher too: injected into tenant pods, they
  # publish through the socket or to the deployment like the monitors.
  - it: refuses turning the DaemonSet off while the preflight checks still publish to the socket
    template: templates/platform-connector-deployment-validation.yaml
    values:
      - ./values/publishers-on-deployment.yaml
    set:
      global.preflight.enabled: true
      preflight.publishTo: socket
    asserts:
      - failedTemplate:
          errorPattern: preflight.publishTo is "socket" but platformConnector.daemonset.enabled is false

  # The lifecycle manager publishes only through its MaintenanceRequest
  # controller, off by default, so its publishTo is paired the same way but
  # only while that controller is enabled.
  - it: refuses turning the DaemonSet off while the lifecycle manager's MaintenanceRequest controller still publishes to the socket
    template: templates/platform-connector-deployment-validation.yaml
    values:
      - ./values/publishers-on-deployment.yaml
    set:
      global.lifecycleManager.enabled: true
      lifecycle-manager.controllers.maintenanceRequest.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: lifecycle-manager.publishTo is "socket" but platformConnector.daemonset.enabled is false

  - it: accepts turning the DaemonSet off once the lifecycle manager publishes to the deployment too
    template: templates/platform-connector-deployment-validation.yaml
    values:
      - ./values/publishers-on-deployment.yaml
    set:
      global.lifecycleManager.enabled: true
      lifecycle-manager.controllers.maintenanceRequest.enabled: true
      lifecycle-manager.publishTo: deployment
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses the lifecycle manager publishing to the deployment while the deployment platform connector is disabled
    template: templates/platform-connector-deployment-validation.yaml
    set:
      global.lifecycleManager.enabled: true
      lifecycle-manager.controllers.maintenanceRequest.enabled: true
      lifecycle-manager.publishTo: deployment
    asserts:
      - failedTemplate:
          errorPattern: lifecycle-manager.publishTo is "deployment" but platformConnector.deployment.enabled is false

  - it: ignores the lifecycle manager's publishTo while its MaintenanceRequest controller is off
    template: templates/platform-connector-deployment-validation.yaml
    values:
      - ./values/publishers-on-deployment.yaml
    set:
      global.lifecycleManager.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: ignores publishTo socket on a disabled publisher subchart when the DaemonSet is off
    template: templates/platform-connector-deployment-validation.yaml
    values:
      - ./values/publishers-on-deployment.yaml
    set:
      csp-health-monitor.publishTo: socket
    asserts:
      - hasDocuments:
          count: 0
