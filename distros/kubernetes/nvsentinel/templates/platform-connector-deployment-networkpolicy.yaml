{{/*
The gRPC allow rule. Only pods labelled nvsentinel.nvidia.com/health-publisher
may reach the port, from the release namespace, the namespaces of the
cross-node allowlist, and every namespace while the preflight checks publish
here. While a host-network publisher targets the Deployment, the rule admits
every source (see nvsentinel.pcDeployment.hostNetworkPublisherReason); the
caller token still decides who may publish.
*/}}
{{- if and (include "nvsentinel.pcDeployment.enabled" .) .Values.networkPolicy.enabled }}
{{- $openReason := include "nvsentinel.pcDeployment.hostNetworkPublisherReason" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nvsentinel.pcDeployment.name" . }}-grpc-access
  labels:
    {{- include "nvsentinel.pcDeployment.labels" . | nindent 4 }}
  {{- if $openReason }}
  annotations:
    nvsentinel.nvidia.com/grpc-ingress: {{ printf "open to every source: %s, which a policy-enforcing CNI identifies by node, not by pod labels; the caller token decides who may publish" $openReason | quote }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "nvsentinel.pcDeployment.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if $openReason }}
    - ports:
        - protocol: TCP
          port: {{ include "nvsentinel.pcDeployment.grpcPort" . }}
    {{- else }}
    - from:
        {{- $namespaces := list .Release.Namespace }}
        {{- range $sa := include "nvsentinel.pcAuth.crossNodeUsernames" . | fromJsonArray }}
        {{- $namespaces = append $namespaces (index (splitList ":" $sa) 2) }}
        {{- end }}
        {{- range $ns := uniq $namespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
          podSelector:
            matchLabels:
              nvsentinel.nvidia.com/health-publisher: "true"
        {{- end }}
        {{- if include "nvsentinel.pcDeployment.preflightPublisher" . }}
        # Preflight checks run in tenant pods the webhook labels, in any namespace.
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              nvsentinel.nvidia.com/health-publisher: "true"
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ include "nvsentinel.pcDeployment.grpcPort" . }}
    {{- end }}
{{- end }}
